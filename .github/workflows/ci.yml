name: CI Workflow

on:
  push:
    branches: [ main, master, malavika-feature ]
  pull_request:
    branches: [ main, master, malavika-feature ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd drift-retrain-platform
          pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: |
          cd drift-retrain-platform
          python scripts/generate_synthetic_customer_churn.py

      - name: Run Flake8 Lint
        run: |
          cd drift-retrain-platform
          PYTHONPATH=src flake8 src tests test_batch_manager.py test_config.py test_dataset_loader.py test_feature_alignment.py test_preprocessor.py test_schema.py

      - name: Run Mypy Type Check
        run: |
          cd drift-retrain-platform
          PYTHONPATH=src mypy src

      - name: Run Pytest Test Suite
        run: |
          cd drift-retrain-platform
          PYTHONPATH=src pytest

      - name: Run Main Orchestration Pipeline
        run: |
          cd drift-retrain-platform
          PYTHONPATH=src python src/main.py
